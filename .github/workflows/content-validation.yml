name: Content validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test schemas, compiler, security rules, and reproducibility
        run: npm run validate
      - name: Compile the actual deployable Static Assets bundle
        run: node scripts/build-static-bundle.mjs --content content --output dist-static --source-commit "$GITHUB_SHA"
      - name: Prove the Worker and Static Assets configuration can package without credentials
        run: npm run worker:dry-run
      - name: Audit runtime dependencies
        run: npm audit --audit-level=moderate
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: content-validation-${{ github.run_id }}
          path: |
            dist-static/deployment-manifest.json
            dist-worker-dry-run/
          if-no-files-found: warn
          retention-days: 14
